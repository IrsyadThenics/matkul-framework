<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Booking - Test Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            font-family: 'Monaco', 'Menlo', monospace;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ccff00;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(204, 255, 0, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #ccff00;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 0.85em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.9em;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ccff00;
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ccff00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(204, 255, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group button {
            padding: 10px;
        }

        .button-danger {
            background: #ef4444;
            color: #fff;
        }

        .button-danger:hover {
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .button-success {
            background: #22c55e;
            color: #fff;
        }

        .button-success:hover {
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }

        .button-warning {
            background: #f59e0b;
            color: #fff;
        }

        .button-warning:hover {
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
        }

        #response, #list {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.85em;
            line-height: 1.6;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }

        .info {
            color: #3b82f6;
        }

        .booking-item {
            background: rgba(51, 65, 85, 0.5);
            border-left: 3px solid #ccff00;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .booking-code {
            color: #ccff00;
            font-weight: bold;
        }

        .booking-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-approved {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 16px;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid #475569;
            color: #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: #ccff00;
            color: #000;
            border-color: #ccff00;
        }

        .tab-btn:hover {
            border-color: #ccff00;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .action-buttons button {
            padding: 10px;
            font-size: 0.8em;
        }

        .separator {
            border-top: 1px solid #334155;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>API Booking - Test Console</h1>

        <div class="grid">
            <!-- Create/Update Booking -->
            <div class="card">
                <h2>Create/Update Booking</h2>
                
                <div class="form-group">
                    <label>Booking ID (untuk update, kosongkan untuk create)</label>
                    <input type="number" id="bookingId" placeholder="Contoh: 1">
                </div>

                <div class="form-group">
                    <label>User ID *</label>
                    <input type="number" id="userId" placeholder="Contoh: 1" required>
                </div>

                <div class="form-group">
                    <label>Court ID *</label>
                    <input type="number" id="courtId" placeholder="Contoh: 1" required>
                </div>

                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label>Start Time (HH:MM) *</label>
                    <input type="time" id="startTime" required>
                </div>

                <div class="form-group">
                    <label>End Time (HH:MM) *</label>
                    <input type="time" id="endTime" required>
                </div>

                <div class="form-group">
                    <label>Duration Hours *</label>
                    <input type="number" id="durationHours" min="1" placeholder="Contoh: 2" required>
                </div>

                <div class="form-group">
                    <label>Total Price (IDR) *</label>
                    <input type="number" id="totalPrice" min="0" placeholder="Contoh: 200000" required>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>

                <div class="button-group">
                    <button onclick="createBooking()" class="button-success">CREATE</button>
                    <button onclick="updateBooking()" class="button-warning">UPDATE</button>
                </div>

                <div id="response"></div>
            </div>

            <!-- Get/Delete Booking -->
            <div class="card">
                <h2>Get/Delete Booking</h2>
                
                <div class="form-group">
                    <label>Booking ID *</label>
                    <input type="number" id="getBookingId" placeholder="Contoh: 1" required>
                </div>

                <button onclick="getBooking()">GET DETAIL</button>
                <button onclick="deleteBooking()" class="button-danger" style="margin-top: 10px;">DELETE</button>

                <div class="tab-buttons" style="margin-top: 20px;">
                    <button class="tab-btn active" onclick="switchTab('detail')">Detail Response</button>
                    <button class="tab-btn" onclick="switchTab('list')">List All</button>
                </div>

                <div id="detail-tab">
                    <div id="response2"></div>
                </div>

                <div id="list-tab" style="display: none;">
                    <button onclick="getAllBookings()" style="margin-bottom: 15px;">LOAD ALL</button>
                    <div id="list"></div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="card">
            <h2>Quick Actions</h2>
            
            <div class="form-group">
                <label>Booking ID *</label>
                <input type="number" id="actionBookingId" placeholder="Contoh: 1" required>
            </div>

            <div class="action-buttons">
                <button onclick="approveBooking()" class="button-success">APPROVE</button>
                <button onclick="rejectBooking()" class="button-danger">REJECT</button>
                <button onclick="getByUser()">GET BY USER</button>
            </div>

            <div id="response3" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentTab = 'detail';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('detail-tab').style.display = tab === 'detail' ? 'block' : 'none';
            document.getElementById('list-tab').style.display = tab === 'list' ? 'block' : 'none';
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function createBooking() {
            const data = {
                user_id: parseInt(document.getElementById('userId').value),
                court_id: parseInt(document.getElementById('courtId').value),
                date: document.getElementById('date').value,
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value,
                duration_hours: parseInt(document.getElementById('durationHours').value),
                total_price: parseInt(document.getElementById('totalPrice').value)
            };

            try {
                const response = await fetch(`${API_URL}/bookings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': getCsrfToken()
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                showResponse(result, 'response');
            } catch (error) {
                showError(error, 'response');
            }
        }

        async function updateBooking() {
            const id = document.getElementById('bookingId').value;
            if (!id) {
                showErrorText('Masukkan Booking ID', 'response');
                return;
            }

            const data = {};
            if (document.getElementById('userId').value) data.user_id = parseInt(document.getElementById('userId').value);
            if (document.getElementById('courtId').value) data.court_id = parseInt(document.getElementById('courtId').value);
            if (document.getElementById('date').value) data.date = document.getElementById('date').value;
            if (document.getElementById('startTime').value) data.start_time = document.getElementById('startTime').value;
            if (document.getElementById('endTime').value) data.end_time = document.getElementById('endTime').value;
            if (document.getElementById('durationHours').value) data.duration_hours = parseInt(document.getElementById('durationHours').value);
            if (document.getElementById('totalPrice').value) data.total_price = parseInt(document.getElementById('totalPrice').value);
            data.status = document.getElementById('status').value;

            try {
                const response = await fetch(`${API_URL}/bookings/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': getCsrfToken()
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                showResponse(result, 'response');
            } catch (error) {
                showError(error, 'response');
            }
        }

        async function getBooking() {
            const id = document.getElementById('getBookingId').value;
            if (!id) {
                showErrorText('Masukkan Booking ID', 'response2');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/bookings/${id}`);
                const result = await response.json();
                showResponse(result, 'response2');
            } catch (error) {
                showError(error, 'response2');
            }
        }

        async function getAllBookings() {
            try {
                const response = await fetch(`${API_URL}/bookings`);
                const result = await response.json();
                displayBookings(result.data);
            } catch (error) {
                showError(error, 'list');
            }
        }

        async function deleteBooking() {
            const id = document.getElementById('getBookingId').value;
            if (!id) {
                showErrorText('Masukkan Booking ID', 'response2');
                return;
            }

            if (!confirm('Yakin ingin menghapus booking ini?')) return;

            try {
                const response = await fetch(`${API_URL}/bookings/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRF-TOKEN': getCsrfToken()
                    }
                });

                const result = await response.json();
                showResponse(result, 'response2');
            } catch (error) {
                showError(error, 'response2');
            }
        }

        async function approveBooking() {
            const id = document.getElementById('actionBookingId').value;
            if (!id) {
                showErrorText('Masukkan Booking ID', 'response3');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/bookings/${id}/approve`, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': getCsrfToken()
                    }
                });

                const result = await response.json();
                showResponse(result, 'response3');
            } catch (error) {
                showError(error, 'response3');
            }
        }

        async function rejectBooking() {
            const id = document.getElementById('actionBookingId').value;
            if (!id) {
                showErrorText('Masukkan Booking ID', 'response3');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/bookings/${id}/reject`, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': getCsrfToken()
                    }
                });

                const result = await response.json();
                showResponse(result, 'response3');
            } catch (error) {
                showError(error, 'response3');
            }
        }

        async function getByUser() {
            const userId = document.getElementById('actionBookingId').value;
            if (!userId) {
                showErrorText('Masukkan User ID', 'response3');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${userId}/bookings`);
                const result = await response.json();
                showResponse(result, 'response3');
            } catch (error) {
                showError(error, 'response3');
            }
        }

        function displayBookings(bookings) {
            const list = document.getElementById('list');
            list.innerHTML = '';

            if (bookings.length === 0) {
                list.innerHTML = '<p class="info">No bookings found</p>';
                return;
            }

            bookings.forEach(booking => {
                const statusClass = `status-${booking.status}`;
                const item = `
                    <div class="booking-item">
                        <div class="booking-code">BK: ${booking.booking_code}</div>
                        <div>👤 ${booking.user.name} (${booking.user.email})</div>
                        <div>🏐 ${booking.court.name}</div>
                        <div>📅 ${booking.date} | ⏰ ${booking.start_time} - ${booking.end_time}</div>
                        <div>💰 Rp ${new Intl.NumberFormat('id-ID').format(booking.total_price)}</div>
                        <span class="booking-status ${statusClass}">${booking.status.toUpperCase()}</span>
                    </div>
                `;
                list.innerHTML += item;
            });
        }

        function showResponse(data, elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<pre class="success">${JSON.stringify(data, null, 2)}</pre>`;
        }

        function showError(error, elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<pre class="error">❌ Error: ${error.message}</pre>`;
        }

        function showErrorText(text, elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<pre class="error">❌ ${text}</pre>`;
        }

        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]')?.content || '';
        }

        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();
    </script>
</body>
</html>
